name: Dependabot auto-merge

# Turns on GitHub auto-merge for Dependabot patch and minor updates, so
# they land on their own once the required CI checks pass. Major updates
# are left for a human.
#
# REQUIRES a branch protection rule (or ruleset) on main with required
# status checks. Without one there is nothing for auto-merge to wait for
# and the PR merges immediately, before CI has run.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
