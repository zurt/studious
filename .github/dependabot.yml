version: 2

updates:
  # `uv` (not `pip`): updates backend/uv.lock itself, including transitive
  # deps. The `pip` ecosystem only saw pyproject.toml and produced PRs
  # that raised `>=` lower bounds without touching the lockfile.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # vitest and @vitest/* must be the exact same version (peer dependency),
      # so they move together, majors included. Listed first: a dependency
      # joins the first group it matches.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
