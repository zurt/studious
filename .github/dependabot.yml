version: 2

updates:
  # `uv` (not `pip`): updates backend/uv.lock itself, including transitive
  # deps. The `pip` ecosystem only saw pyproject.toml and produced PRs
  # that raised `>=` lower bounds without touching the lockfile.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # vitest and @vitest/* must be the exact same version (peer dependency),
      # so they move together, majors included. Listed first: a dependency
      # joins the first group it matches.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # The root Dockerfile: base images are pinned by tag and digest, so this
  # proposes new tags (and their digests) for node, python and uv.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # A new Python minor arrives before every dependency ships wheels for
    # it, and the image has no compiler, so the build fails (uvloop on
    # 3.15, 2026-11). Move the Python minor by hand, with the docker job
    # green.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
