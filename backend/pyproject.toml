[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "studious-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.33",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "PyMuPDF>=1.27.2.3",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "anthropic>=2.6.0",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pip-audit>=2.10.1",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
